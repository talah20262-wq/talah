<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>متجر طَلَّة</title>

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>

:root{
--p:#d4af37;
--bg:#f6f6f6;
--card:#fff;
--t:#111;
}

body{
margin:0;
font-family:'Cairo';
background:var(--bg);
color:var(--t);
padding-bottom:120px;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
background:var(--card);
position:sticky;
top:0;
z-index:1000;
}

.logo-box{
display:flex;
align-items:center;
gap:10px;
}

#site-logo{
width:45px;
height:45px;
border-radius:50%;
object-fit:cover;
border:2px solid var(--p);
}

.container{padding:10px;max-width:1200px;margin:auto}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

@media(min-width:768px){
.grid{grid-template-columns:repeat(4,1fr)}
}

.card{
background:var(--card);
padding:10px;
border-radius:15px;
}

input,textarea,select{
width:100%;
padding:10px;
margin-top:10px;
border-radius:10px;
border:1px solid #ddd;
}

button{
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.btn-p{background:var(--p);color:#fff}

.nav{
position:fixed;
bottom:10px;
left:50%;
transform:translateX(-50%);
background:#fff;
padding:10px;
border-radius:25px;
display:flex;
gap:25px;
}

.page{display:none}
.page.active{display:block}

.admin-card{
background:#fff;
padding:15px;
margin:10px 0;
border-radius:15px;
}

</style>

</head>

<body>

<header>
<div class="logo-box">
<img id="site-logo" src="">
<h2 id="site-name">طَلَّة</h2>
</div>

<i class="fas fa-crown" onclick="adminAuth()"></i>
</header>

<div class="container">

<!-- SHOP -->
<section id="shop" class="page active">
<div id="products" class="grid"></div>
</section>

<!-- TRACK -->
<section id="track" class="page">
<div class="card">
<h3>تتبع الطلب</h3>
<input id="track-phone" placeholder="رقم الهاتف">
<button class="btn-p" onclick="trackOrder()">بحث</button>
</div>

<div id="track-result"></div>
</section>

<!-- ADMIN -->
<section id="admin" class="page">

<div class="admin-card">
<h3>إعدادات الموقع</h3>

<input id="set-name" placeholder="اسم الموقع">
<input type="file" id="set-logo">

<button class="btn-p" onclick="saveSettings()">حفظ</button>
</div>

<div class="admin-card">
<h3>إضافة منتج</h3>

<input id="p-title" placeholder="اسم المنتج">
<input id="p-price" placeholder="السعر">
<input id="p-old" placeholder="السعر القديم">
<input id="p-discount" placeholder="خصم">
<input id="p-link" placeholder="لينك">

<input type="file" id="p-file">

<button class="btn-p" onclick="addProduct()">نشر</button>
</div>

<h3>الطلبات</h3>
<div id="orders"></div>

</section>

</div>

<div class="nav">
<span onclick="tab('shop')">🛍</span>
<span onclick="tab('track')">📦</span>
<span onclick="tab('admin')" id="adminBtn" style="display:none">⚙</span>
</div>

<script>

const firebaseConfig = {
databaseURL:"https://talah-c12c5-default-rtdb.asia-southeast1.firebasedatabase.app/"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const CLOUD_NAME="dfbqpjtvm";
const UPLOAD_PRESET="talla_preset";

let isAdmin=localStorage.getItem("admin")==="true";

/* SETTINGS */
function loadSettings(){
db.ref("settings").on("value",s=>{
if(s.exists()){
let d=s.val();
document.getElementById("site-name").innerText=d.name||"طَلَّة";
document.getElementById("site-logo").src=d.logo||"";
}
});
}

loadSettings();

/* ADMIN AUTH */
function adminAuth(){
let p=prompt("password");
if(p==="2009257mama"){
localStorage.setItem("admin","true");
location.reload();
}
}

if(isAdmin){
document.getElementById("adminBtn").style.display="block";
}

/* TAB */
function tab(id){
document.querySelectorAll(".page").forEach(e=>e.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* SAVE SETTINGS */
async function saveSettings(){
let name=document.getElementById("set-name").value;
let file=document.getElementById("set-logo").files[0];

let logo="";

if(file){
let fd=new FormData();
fd.append("file",file);
fd.append("upload_preset",UPLOAD_PRESET);

let res=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/upload`,{
method:"POST",
body:fd
});

let data=await res.json();
logo=data.secure_url;
}

db.ref("settings").set({
name:name,
logo:logo||document.getElementById("site-logo").src
});

alert("تم الحفظ");
}

/* ADD PRODUCT */
async function addProduct(){

let file=document.getElementById("p-file").files[0];

let fd=new FormData();
fd.append("file",file);
fd.append("upload_preset",UPLOAD_PRESET);

let res=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/upload`,{
method:"POST",
body:fd
});

let data=await res.json();

db.ref("products").push({
title:document.getElementById("p-title").value,
price:document.getElementById("p-price").value,
old:document.getElementById("p-old").value,
discount:document.getElementById("p-discount").value,
link:document.getElementById("p-link").value,
media:data.secure_url
});

alert("تم النشر");
}

/* PRODUCTS */
db.ref("products").on("value",s=>{
let box=document.getElementById("products");
box.innerHTML="";
s.forEach(i=>{
let p=i.val();
box.innerHTML+=`
<div class="card">
<img src="${p.media}" style="width:100%;border-radius:10px">
<h4>${p.title}</h4>
<p>${p.price} ج</p>
<button class="btn-p" onclick="window.open('${p.link}')">اطلب</button>
</div>`;
});
});

/* TRACK ORDER */
function trackOrder(){
let phone=document.getElementById("track-phone").value;

db.ref("orders").orderByChild("phone").equalTo(phone).once("value",s=>{
let box=document.getElementById("track-result");
box.innerHTML="";

if(!s.exists()){
box.innerHTML="لا يوجد طلبات";
return;
}

s.forEach(i=>{
let o=i.val();

/* مهم: عرض الحالة فقط زي ما هي */
box.innerHTML+=`
<div class="card">
<h4>${o.product}</h4>
<p><b>${o.status}</b></p>
<p>${o.total} ج</p>
</div>`;
});
});
}

/* ORDERS ADMIN */
db.ref("orders").on("value",s=>{
let box=document.getElementById("orders");
box.innerHTML="";
s.forEach(i=>{
let o=i.val();

box.innerHTML+=`
<div class="admin-card">
<p>${o.product}</p>
<p>${o.phone}</p>

<input value="${o.status}" onchange="updateStatus('${i.key}',this.value)">

</div>`;
});
});

function updateStatus(id,val){
db.ref("orders/"+id).update({status:val});
}

</script>

</body>
</html>
