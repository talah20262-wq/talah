<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>متجر طَلَّة | الشياكة تبدأ من هنا</title>

<meta name="description"
content="أقوى كولكشن ملابس حريمي بأفخم الخامات وأحدث الموديلات مع شحن سريع لكل المحافظات والدفع عند الاستلام.">

<meta property="og:title" content="متجر طَلَّة | الشياكة تبدأ من هنا">
<meta property="og:description" content="أحدث كولكشن ملابس حريمي بأفخم الخامات والتوصيل لكل المحافظات">
<meta property="og:image" content="https://i.postimg.cc/your-logo.png">
<meta property="og:type" content="website">

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap"
rel="stylesheet">

<style>

:root{
--p:#d4af37;
--bg:#f6f6f6;
--card:#ffffff;
--t:#111111;
--s:#34c759;
--r:#ff3b30;
--blue:#007aff;
}

[data-theme="dark"]{
--bg:#0d0d0d;
--card:#1c1c1e;
--t:#ffffff;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:var(--bg);
color:var(--t);
padding-bottom:140px;
}

header{
position:sticky;
top:0;
z-index:1000;
background:var(--card);
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.logo-box{
display:flex;
align-items:center;
gap:10px;
}

#site-logo{
width:45px;
height:45px;
border-radius:50%;
object-fit:cover;
display:block;
border:2px solid var(--p);
}

.container{
max-width:1300px;
margin:auto;
padding:12px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px;
}

@media(min-width:768px){
.grid{
grid-template-columns:repeat(4,1fr);
}
}

.p-card{
background:var(--card);
border-radius:18px;
overflow:hidden;
box-shadow:0 5px 20px rgba(0,0,0,.07);
transition:.3s;
}

.p-card:hover{
transform:translateY(-4px);
}

.p-img-box{
width:100%;
aspect-ratio:4/5;
background:#fff;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
position:relative;
padding:10px;
}

.p-img-box img,
.p-img-box video{
width:92%;
height:92%;
object-fit:contain;
background:#fff;
cursor:pointer;
border-radius:14px;
transition:.3s;
}

.discount{
position:absolute;
top:10px;
left:10px;
background:#ff3b30;
color:#fff;
padding:5px 12px;
border-radius:30px;
font-size:12px;
font-weight:bold;
z-index:10;
}

.p-info{
padding:14px;
}

.p-title{
font-size:18px;
font-weight:800;
min-height:45px;
}

.old-price{
text-decoration:line-through;
font-size:14px;
color:#999;
margin-top:4px;
}

.new-price{
font-size:25px;
font-weight:900;
color:var(--p);
margin-top:4px;
}

.total-box{
margin-top:10px;
padding:10px;
background:#f7f7f7;
border-radius:12px;
font-weight:bold;
text-align:center;
}

.btn{
width:100%;
padding:14px;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:bold;
margin-top:10px;
font-size:16px;
}

.btn-p{
background:var(--p);
color:#fff;
}

.btn-r{
background:var(--r);
color:#fff;
}

.admin-card{
background:var(--card);
padding:15px;
border-radius:16px;
margin-bottom:15px;
box-shadow:0 5px 15px rgba(0,0,0,.05);
}

.stat-card{
text-align:center;
}

input,
textarea,
select{
width:100%;
padding:13px;
margin-top:10px;
border-radius:12px;
border:1px solid #ddd;
background:var(--bg);
color:var(--t);
}

nav{
position:fixed;
bottom:15px;
left:50%;
transform:translateX(-50%);
width:92%;
max-width:500px;
background:var(--card);
padding:12px;
display:flex;
justify-content:space-around;
border-radius:30px;
box-shadow:0 10px 25px rgba(0,0,0,.2);
z-index:1000;
}

.nav-item{
font-size:22px;
cursor:pointer;
color:#888;
}

.nav-item.active{
color:var(--p);
}

.page{
display:none;
}

.page.active{
display:block;
}

.social-bar{
position:fixed;
bottom:85px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:18px;
z-index:999;
}

.social-item{
width:50px;
height:50px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
color:#fff;
text-decoration:none;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}

.wa{background:#25D366;}
.fb{background:#1877F2;}
.tk{background:#000;}

.invoice{
padding:15px;
text-align:right;
line-height:2;
}

.owner-box{
margin-top:20px;
text-align:center;
padding:20px;
background:var(--card);
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.owner-box img{
width:90px;
height:90px;
border-radius:50%;
object-fit:cover;
border:3px solid var(--p);
margin-bottom:10px;
}

</style>

</head>

<body>

<header>

<div class="logo-box">

<img id="site-logo"
src="https://i.postimg.cc/your-logo.png">

<div style="font-size:24px;font-weight:900;color:var(--p)">

<span id="site-name">طَلَّة</span>

<i class="fas fa-check-circle"
style="color:#007aff;font-size:14px"></i>

</div>

</div>

<div style="display:flex;gap:15px">

<i class="fas fa-moon"
onclick="toggleTheme()"
style="cursor:pointer"></i>

<i class="fas fa-crown"
onclick="adminAuth()"
style="cursor:pointer;color:var(--p)"></i>

</div>

</header>

<div class="container">

<section id="p-shop" class="page active">

<div id="product-list" class="grid"></div>

<div class="owner-box">

<img src="https://i.postimg.cc/your-logo.png">

<h2>Mahmoud Mohamed</h2>

<p style="margin-top:8px">
أفخم كولكشن حريمي بأعلى جودة وخامات مستوردة
</p>

</div>

</section>

<section id="p-track" class="page">

<div class="admin-card">

<h2>تتبع الطلب</h2>

<input type="tel"
id="track-input"
placeholder="رقم الموبايل">

<button class="btn btn-p"
onclick="trackOrder()">

تتبع الآن

</button>

</div>

<div id="track-results"></div>

</section>

<section id="p-owner" class="page">

<div class="grid">

<div class="admin-card stat-card">

<i class="fas fa-eye"></i>

<h2 id="visit-count">0</h2>

<p>الزيارات</p>

</div>

<div class="admin-card stat-card">

<i class="fas fa-mouse-pointer"></i>

<h2 id="click-count">0</h2>

<p>الضغطات</p>

</div>

<div class="admin-card stat-card">

<i class="fas fa-shopping-basket"></i>

<h2 id="order-count">0</h2>

<p>الطلبات</p>

</div>

</div>

<div class="admin-card">

<h2>إضافة منتج جديد</h2>

<input type="text"
id="new-p-title"
placeholder="اسم المنتج">

<input type="number"
id="new-p-oldprice"
placeholder="السعر قبل الخصم">

<input type="number"
id="new-p-price"
placeholder="السعر الحالي">

<input type="number"
id="new-p-discount"
placeholder="نسبة الخصم %">

<input type="url"
id="new-p-link"
placeholder="لينك الفيديو أو المنشور">

<input type="file"
id="new-p-file"
accept="image/*,video/*">

<button class="btn btn-p"
onclick="uploadProduct()">

نشر المنتج

</button>

</div>

<h2 style="margin:15px 0">

إدارة الطلبات

</h2>

<div id="admin-orders"></div>

</section>

</div>

<div class="social-bar">

<a href="https://wa.me/201026482060"
class="social-item wa"
target="_blank">

<i class="fab fa-whatsapp"></i>

</a>

<a href="https://facebook.com/USERNAME"
class="social-item fb"
target="_blank">

<i class="fab fa-facebook-f"></i>

</a>

<a href="https://tiktok.com/@USERNAME"
class="social-item tk"
target="_blank">

<i class="fab fa-tiktok"></i>

</a>

</div>

<nav>

<div class="nav-item active"
onclick="tab('p-shop',this)">

<i class="fas fa-store"></i>

</div>

<div class="nav-item"
onclick="tab('p-track',this)">

<i class="fas fa-box"></i>

</div>

<div id="admin-tab"
class="nav-item"
style="display:none"
onclick="tab('p-owner',this)">

<i class="fas fa-user-shield"></i>

</div>

</nav>

<script>

const firebaseConfig = {

databaseURL:
"https://talah-c12c5-default-rtdb.asia-southeast1.firebasedatabase.app/"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

const CLOUD_NAME = "dfbqpjtvm";

const UPLOAD_PRESET = "talla_preset";

let isAdmin =
localStorage.getItem('tallah_admin') === 'true';

window.onload = ()=>{

trackVisit();

syncProducts();

if(isAdmin){

document.getElementById('admin-tab')
.style.display='block';

syncStats();

syncAdminOrders();

}

};

function trackVisit(){

db.ref('stats/visits')
.transaction(c=>(c||0)+1);

}

function syncStats(){

db.ref('stats/visits')
.on('value',s=>{

document.getElementById('visit-count')
.innerText = s.val() || 0;

});

db.ref('stats/clicks')
.on('value',s=>{

document.getElementById('click-count')
.innerText = s.val() || 0;

});

db.ref('orders')
.on('value',s=>{

document.getElementById('order-count')
.innerText = s.numChildren();

});

}

function tab(id,el){

document.querySelectorAll('.page')
.forEach(p=>p.classList.remove('active'));

document.getElementById(id)
.classList.add('active');

document.querySelectorAll('.nav-item')
.forEach(n=>n.classList.remove('active'));

el.classList.add('active');

}

function syncProducts(){

db.ref('products')
.on('value',snap=>{

const list =
document.getElementById('product-list');

list.innerHTML = "";

snap.forEach(c=>{

const p = c.val();

let media = p.type === 'video'

?

`<video
src="${p.media}"
autoplay
muted
loop
playsinline
onclick="openProductLink('${p.link||'#'}')">
</video>`

:

`<img
src="${p.media}"
loading="lazy"
onclick="openProductLink('${p.link||'#'}')">`;

list.innerHTML += `

<div class="p-card">

<div class="p-img-box">

${p.discount ?

`<div class="discount">
خصم ${p.discount}%
</div>`

: ""}

${media}

</div>

<div class="p-info">

<div class="p-title">

${p.title}

</div>

${p.oldPrice ?

`<div class="old-price">

${p.oldPrice} ج.م

</div>`

: ""}

<div class="new-price">

${p.price} ج.م

</div>

<button
class="btn btn-p"
onclick="openOrderModal('${p.title}','${p.price}','${p.media}')">

اطلبي الآن

</button>

${isAdmin ?

`<button
class="btn btn-r"
onclick="delItem('products/${c.key}')">

حذف المنتج

</button>`

: ""}

</div>

</div>

`;

});

});

}

function openProductLink(link){

if(!link || link==="#") return;

db.ref('stats/clicks')
.transaction(c=>(c||0)+1);

window.open(link,'_blank');

}

async function uploadProduct(){

const title =
document.getElementById('new-p-title').value;

const oldPrice =
document.getElementById('new-p-oldprice').value;

const price =
document.getElementById('new-p-price').value;

const discount =
document.getElementById('new-p-discount').value;

const link =
document.getElementById('new-p-link').value;

const file =
document.getElementById('new-p-file').files[0];

if(!title || !price || !file)
return Swal.fire('أكمل البيانات');

Swal.fire({
title:'جاري الرفع...',
didOpen:()=>Swal.showLoading()
});

const formData = new FormData();

formData.append('file',file);

formData.append('upload_preset',UPLOAD_PRESET);

try{

const resp = await fetch(

`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/upload`,

{
method:'POST',
body:formData
}

);

const result = await resp.json();

const type =
file.type.startsWith('video')
? 'video'
: 'image';

await db.ref('products').push({

title,
oldPrice,
price,
discount,
link,
media:result.secure_url,
type,
createdAt:Date.now()

});

Swal.fire(
'تم نشر المنتج',
'',
'success'
);

}catch(e){

Swal.fire(
'خطأ',
'فشل رفع الملف',
'error'
);

}

}

async function openOrderModal(product,price,image){

const {value:res} = await Swal.fire({

title:'طلب '+product,

html:`

<input id="n"
class="swal2-input"
placeholder="الاسم الكامل">

<input id="p"
class="swal2-input"
placeholder="رقم الهاتف">

<input id="color"
class="swal2-input"
placeholder="اللون المطلوب">

<input id="size"
class="swal2-input"
placeholder="المقاس">

<select id="gov" class="swal2-input">

<option value="">اختر المحافظة</option>

<option value="50">القاهرة</option>
<option value="50">الإسكندرية</option>
<option value="70">الجيزة</option>
<option value="70">القليوبية</option>
<option value="70">الشرقية</option>
<option value="70">الغربية</option>
<option value="70">المنوفية</option>
<option value="70">الدقهلية</option>
<option value="70">البحيرة</option>
<option value="70">كفر الشيخ</option>
<option value="70">دمياط</option>
<option value="70">بورسعيد</option>
<option value="70">الإسماعيلية</option>
<option value="70">السويس</option>
<option value="70">الفيوم</option>
<option value="70">بني سويف</option>
<option value="70">المنيا</option>
<option value="70">أسيوط</option>
<option value="70">سوهاج</option>
<option value="70">قنا</option>
<option value="70">الأقصر</option>
<option value="70">أسوان</option>

</select>

<textarea id="a"
class="swal2-textarea"
placeholder="العنوان بالتفصيل"></textarea>

`,

preConfirm:()=>[

document.getElementById('n').value,
document.getElementById('p').value,
document.getElementById('color').value,
document.getElementById('size').value,
document.getElementById('gov').value,
document.getElementById('a').value

]

});

if(res){

let shipping = Number(res[4]);

let total = Number(price) + shipping;

await db.ref('orders').push({

product,
price,
shipping,
total,
image,
name:res[0],
phone:res[1],
color:res[2],
size:res[3],
address:res[5],
status:'قيد المراجعة ⏳',
time:Date.now()

});

Swal.fire({

icon:'success',

title:'تم الطلب بنجاح',

html:`

<div class="invoice">

<h2>فاتورة الطلب</h2>

<p>👤 ${res[0]}</p>

<p>📞 ${res[1]}</p>

<p>🎨 ${res[2]}</p>

<p>📏 ${res[3]}</p>

<p>🚚 الشحن: ${shipping} ج</p>

<p>💰 الإجمالي: ${total} ج</p>

<p>📍 ${res[5]}</p>

<p style="margin-top:15px;color:#25D366">

للتواصل واتساب:
01210538657

</p>

</div>

`

});

tab(
'p-track',
document.querySelectorAll('.nav-item')[1]
);

document.getElementById('track-input').value = res[1];

trackOrder();

}

}

function syncAdminOrders(){

db.ref('orders')
.on('value',snap=>{

const list =
document.getElementById('admin-orders');

list.innerHTML = "";

snap.forEach(c=>{

const o = c.val();

list.innerHTML += `

<div class="admin-card">

<img src="${o.image}"
style="width:100%;border-radius:15px;margin-bottom:10px">

<b>${o.product}</b>

<p>👤 ${o.name}</p>

<p>📞 ${o.phone}</p>

<p>🎨 ${o.color}</p>

<p>📏 ${o.size}</p>

<p>📍 ${o.address}</p>

<p>🚚 ${o.shipping} ج</p>

<p>💰 ${o.total} ج</p>

<p>📦 ${o.status}</p>

<select onchange="updateStatus('${c.key}',this.value)">

<option value="">تحديث الحالة</option>

<option value="تم التأكيد ✅">

تم التأكيد

</option>

<option value="خرج للشحن 🚚">

خرج للشحن

</option>

<option value="تم التسليم 🎉">

تم التسليم

</option>

</select>

<button
class="btn btn-r"
onclick="delItem('orders/${c.key}')">

حذف

</button>

</div>

`;

});

});

}

function updateStatus(id,status){

if(!status) return;

db.ref('orders/'+id)
.update({status});

Swal.fire('تم تحديث الحالة');

}

function trackOrder(){

const tel =
document.getElementById('track-input').value;

db.ref('orders')
.orderByChild('phone')
.equalTo(tel)
.once('value',snap=>{

const div =
document.getElementById('track-results');

div.innerHTML = "";

if(!snap.exists()){

div.innerHTML =
"<p style='text-align:center'>لا يوجد طلبات</p>";

return;

}

snap.forEach(c=>{

div.innerHTML += `

<div class="admin-card">

<img src="${c.val().image}"
style="width:100%;border-radius:15px;margin-bottom:10px">

<h3>${c.val().product}</h3>

<p>الحالة: ${c.val().status}</p>

<p>الإجمالي: ${c.val().total} ج</p>

</div>

`;

});

});

}

async function adminAuth(){

if(isAdmin){

tab(
'p-owner',
document.getElementById('admin-tab')
);

return;

}

const {value:p} = await Swal.fire({

title:'رمز المالك',

input:'password'

});

if(p==="2009257mama"){

localStorage.setItem(
'tallah_admin',
'true'
);

location.reload();

}

}

function toggleTheme(){

document.body.setAttribute(

'data-theme',

document.body.getAttribute('data-theme')
=== 'dark'

?

''

:

'dark'

);

}

function delItem(path){

if(confirm('متأكد من الحذف؟')){

db.ref(path).remove();

}

}

</script>

</body>

</html>
